[project]
name = "tikitarai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "agno>=2.8.6",
    "bcrypt>=5.0.0",
    "cryptography>=50.0.0",
    "duckdb>=1.4",
    # Declared rather than relied on transitively: `dashboard/` renders the exported
    # report through it, so it is a direct dependency now.
    "jinja2>=3.1.6",
    # Rasterizes Plotly charts for the HTML and Excel exports, which have to be
    # self-contained and so cannot ship plotly.js.
    "kaleido>=1.2.0",
    "openai>=2.53.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "pillow>=12.3.0",
    "plotly>=6.9.0",
    "pydantic>=2.13.4",
    "sqlalchemy>=2.0.51",
    "streamlit>=1.60.0",
    "xlsxwriter>=3.2.9",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
